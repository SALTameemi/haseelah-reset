<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إعادة تعيين كلمة المرور | حصيلة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap');

  :root{
    --ink:#1C2B39;
    --paper:#F1E9D8;
    --paper-deep:#E8DEC8;
    --stamp:#9C2F26;
    --gold:#B08D4F;
    --sage:#5F7A5E;
    --line: rgba(28,43,57,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
    background:#0F1720;
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--paper);
    border-radius:16px;
    padding:32px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  h1{
    font-family:'Amiri', serif;
    font-size:26px;
    text-align:center;
    margin:0 0 4px;
    color:var(--ink);
  }
  .subtitle{
    text-align:center;
    font-size:13px;
    color:#6b5f4a;
    margin:0 0 28px;
  }
  label{
    display:block;
    font-size:14px;
    font-weight:500;
    margin-bottom:6px;
    color:var(--ink);
  }
  input{
    width:100%;
    padding:12px 14px;
    margin-bottom:16px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  input:focus{outline:none; border-color:var(--gold);}
  button{
    width:100%;
    padding:14px;
    background:var(--sage);
    color:#fff;
    border:none;
    border-radius:10px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
  }
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .msg{
    text-align:center;
    font-size:14px;
    margin-top:16px;
    padding:12px;
    border-radius:8px;
    display:none;
  }
  .msg.error{background:rgba(156,47,38,0.1); color:var(--stamp); display:block;}
  .msg.success{background:rgba(95,122,94,0.12); color:var(--sage); display:block;}
  .msg.info{background:rgba(28,43,57,0.06); color:var(--ink); display:block;}
</style>
</head>
<body>
  <div class="card">
    <h1>إعادة تعيين كلمة المرور</h1>
    <p class="subtitle">Reset Password · حصيلة Haseelah</p>

    <div id="formArea">
      <label>كلمة المرور الجديدة / New Password</label>
      <input type="password" id="newPassword" placeholder="أدخل كلمة المرور الجديدة" autocomplete="new-password">

      <label>تأكيد كلمة المرور / Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" autocomplete="new-password">

      <button id="submitBtn">تحديث كلمة المرور · Update Password</button>
    </div>

    <div id="message" class="msg"></div>
  </div>

<script>
  const SUPABASE_URL = 'https://shorpwcajwnunvkvdezw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_e5-J3LMf7s6tYN8ocs78yg_IwEspBPv';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true, persistSession: false }
  });

  const msgEl = document.getElementById('message');
  const formArea = document.getElementById('formArea');
  const submitBtn = document.getElementById('submitBtn');
  const titleEl = document.querySelector('h1');
  const subtitleEl = document.querySelector('.subtitle');

  function showMsg(text, type){
    msgEl.textContent = text;
    msgEl.className = 'msg ' + type;
  }

  // يحدد نوع الرابط (تأكيد حساب جديد، أو استعادة كلمة مرور) من الرابط نفسه
  function getLinkType(){
    const hash = window.location.hash.replace(/^#/, '');
    const hashParams = new URLSearchParams(hash);
    const queryParams = new URLSearchParams(window.location.search);
    return hashParams.get('type') || queryParams.get('type') || '';
  }

  let sessionReady = false;
  const linkType = getLinkType();
  const isSignupConfirmation = (linkType === 'signup' || linkType === 'email' || linkType === 'invite');

  async function checkSession(){
    const { data, error } = await supabaseClient.auth.getSession();
    if (data && data.session) {
      sessionReady = true;
      if (isSignupConfirmation) {
        formArea.style.display = 'none';
        titleEl.textContent = 'تم تأكيد حسابك بنجاح!';
        subtitleEl.textContent = 'Account confirmed · حصيلة Haseelah';
        showMsg('حسابك جاهز الآن. ارجعي لتطبيق حصيلة وسجلي دخولك.\nYour account is ready. You can now return to the Haseelah app and log in.', 'success');
      }
    } else {
      showMsg('الرابط غير صالح أو منتهي الصلاحية. الرجاء طلب رابط جديد من التطبيق.\nLink invalid or expired. Please request a new one from the app.', 'error');
      formArea.style.display = 'none';
    }
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) {
      sessionReady = true;
    }
  });

  checkSession();

  submitBtn.addEventListener('click', async () => {
    const pass1 = document.getElementById('newPassword').value;
    const pass2 = document.getElementById('confirmPassword').value;

    if (!pass1 || !pass2) {
      showMsg('الرجاء تعبئة كلا الحقلين. / Please fill both fields.', 'error');
      return;
    }
    if (pass1.length < 6) {
      showMsg('كلمة المرور لازم تكون 6 أحرف على الأقل. / Password must be at least 6 characters.', 'error');
      return;
    }
    if (pass1 !== pass2) {
      showMsg('كلمتا المرور غير متطابقتين. / Passwords do not match.', 'error');
      return;
    }
    if (!sessionReady) {
      showMsg('الرابط غير صالح. الرجاء طلب رابط جديد من التطبيق. / Invalid link, please request a new one.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري التحديث... Updating...';

    const { error } = await supabaseClient.auth.updateUser({ password: pass1 });

    if (error) {
      showMsg('حدث خطأ: ' + error.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'تحديث كلمة المرور · Update Password';
    } else {
      formArea.style.display = 'none';
      showMsg('تم تحديث كلمة المرور بنجاح! يمكنك الآن الرجوع لتطبيق حصيلة وتسجيل الدخول.\nPassword updated successfully! You can now return to the Haseelah app and log in.', 'success');
    }
  });
</script>
</body>
</html>
