<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حصيلة | Haseelah</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap');
  :root{
    --ink:#1C2B39; --paper:#F1E9D8; --stamp:#9C2F26;
    --gold:#B08D4F; --sage:#5F7A5E; --line: rgba(28,43,57,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
    background:#0F1720; color:var(--ink);
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; padding:20px;
  }
  .card{
    width:100%; max-width:420px; background:var(--paper);
    border-radius:16px; padding:32px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  h1{
    font-family:'Amiri', serif; font-size:24px; text-align:center;
    margin:0 0 4px; color:var(--ink);
  }
  .subtitle{ text-align:center; font-size:13px; color:#6b5f4a; margin:0 0 28px; }
  label{ display:block; font-size:13px; font-weight:700; margin-bottom:6px; }
  label small{ font-weight:400; opacity:0.8; }
  input{
    width:100%; padding:10px 0; margin-bottom:18px;
    border:none; border-bottom:1.5px dashed var(--line);
    background:transparent; font-family:'Amiri', serif;
    font-size:16px; color:var(--ink); outline:none;
  }
  button{
    width:100%; padding:14px; background:var(--sage); color:#fff;
    border:none; border-radius:10px; font-family:'Tajawal',sans-serif;
    font-size:16px; font-weight:700; cursor:pointer; margin-top:8px;
  }
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .msg{
    text-align:center; font-size:14px; margin-top:16px;
    padding:12px; border-radius:8px; display:none; white-space:pre-line;
    line-height:1.7;
  }
  .msg.error{background:rgba(156,47,38,0.1); color:var(--stamp); display:block;}
  .msg.success{background:rgba(95,122,94,0.12); color:var(--sage); display:block;}
  .msg.info{background:rgba(28,43,57,0.06); color:var(--ink); display:block;}
  #loading{ text-align:center; font-size:14px; color:#6b5f4a; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="pageTitle">جارٍ التحقق...</h1>
    <p class="subtitle" id="pageSubtitle">Verifying · حصيلة Haseelah</p>

    <div id="formArea" style="display:none;">
      <label>كلمة المرور الجديدة <small>NEW PASSWORD</small></label>
      <input type="password" id="newPassword" autocomplete="new-password">

      <label>تأكيد كلمة المرور <small>CONFIRM PASSWORD</small></label>
      <input type="password" id="confirmPassword" autocomplete="new-password">

      <button id="submitBtn">تحديث كلمة المرور · Update Password</button>
    </div>

    <div id="message" class="msg"></div>
  </div>

<script>
  const SUPABASE_URL = 'https://shorpwcajwnunvkvdezw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_e5-J3LMf7s6tYN8ocs78yg_IwEspBPv';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true, persistSession: false, flowType: 'implicit' }
  });

  const msgEl = document.getElementById('message');
  const formArea = document.getElementById('formArea');
  const submitBtn = document.getElementById('submitBtn');
  const titleEl = document.getElementById('pageTitle');
  const subtitleEl = document.getElementById('pageSubtitle');

  function showMsg(text, type){
    msgEl.textContent = text;
    msgEl.className = 'msg ' + type;
  }
  function setHeading(ar, en){
    titleEl.textContent = ar;
    subtitleEl.textContent = en + ' · حصيلة Haseelah';
  }

  // يقرأ البارامترات من الـ hash ومن الـ query معًا
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const queryParams = new URLSearchParams(window.location.search);
  function param(name){ return hashParams.get(name) || queryParams.get(name); }

  const linkType = (param('type') || '').toLowerCase();
  const isRecovery = linkType === 'recovery';

  function showRecoveryForm(){
    setHeading('إعادة تعيين كلمة المرور', 'Reset Password');
    formArea.style.display = 'block';
    msgEl.className = 'msg';
  }
  function showConfirmed(){
    setHeading('تم تأكيد حسابك بنجاح!', 'Account confirmed');
    formArea.style.display = 'none';
    showMsg('حسابك جاهز الآن. ارجعي لتطبيق حصيلة وسجلي دخولك.\nYour account is ready. Return to the Haseelah app and log in.', 'success');
  }
  function showInvalid(extra){
    setHeading('الرابط غير صالح', 'Invalid link');
    formArea.style.display = 'none';
    showMsg('الرابط غير صالح أو منتهي الصلاحية. الرجاء طلب رابط جديد من التطبيق.\nLink invalid or expired. Please request a new one from the app.' + (extra ? '\n\n(' + extra + ')' : ''), 'error');
  }

  async function establishSession(){
    // 1) خطأ صريح بالرابط
    const errDesc = param('error_description') || param('error');
    if (errDesc) { showInvalid(errDesc); return false; }

    // 2) رابط بصيغة token_hash (الصيغة الأحدث من Supabase)
    const tokenHash = param('token_hash');
    if (tokenHash) {
      const { error } = await sb.auth.verifyOtp({
        token_hash: tokenHash,
        type: isRecovery ? 'recovery' : 'signup'
      });
      if (error) { showInvalid(error.message); return false; }
      return true;
    }

    // 3) رابط بصيغة code (PKCE)
    const code = param('code');
    if (code && sb.auth.exchangeCodeForSession) {
      const { error } = await sb.auth.exchangeCodeForSession(code);
      if (error) { showInvalid(error.message); return false; }
      return true;
    }

    // 4) رابط بصيغة access_token بالـ hash (الصيغة الكلاسيكية)
    const accessToken = param('access_token');
    const refreshToken = param('refresh_token');
    if (accessToken) {
      const { error } = await sb.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken || ''
      });
      if (error) { showInvalid(error.message); return false; }
      return true;
    }

    // 5) آخر محاولة: جلسة موجودة أصلاً
    const { data } = await sb.auth.getSession();
    if (data && data.session) return true;

    showInvalid('no token in link');
    return false;
  }

  (async function init(){
    const ok = await establishSession();
    if (!ok) return;
    if (isRecovery) showRecoveryForm();
    else showConfirmed();
  })();

  submitBtn.addEventListener('click', async () => {
    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('confirmPassword').value;

    if (!p1 || !p2) { showMsg('الرجاء تعبئة كلا الحقلين. / Please fill both fields.', 'error'); return; }
    if (p1.length < 6) { showMsg('كلمة المرور لازم تكون 6 أحرف على الأقل. / At least 6 characters.', 'error'); return; }
    if (p1 !== p2) { showMsg('كلمتا المرور غير متطابقتين. / Passwords do not match.', 'error'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري التحديث... Updating...';

    const { error } = await sb.auth.updateUser({ password: p1 });

    if (error) {
      showMsg('حدث خطأ: ' + error.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'تحديث كلمة المرور · Update Password';
    } else {
      formArea.style.display = 'none';
      setHeading('تم تحديث كلمة المرور', 'Password updated');
      showMsg('تم بنجاح! ارجعي لتطبيق حصيلة وسجلي دخولك بكلمة المرور الجديدة.\nDone! Return to the Haseelah app and log in with your new password.', 'success');
    }
  });
</script>
</body>
</html>
